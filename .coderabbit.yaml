# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-US
early_access: false

tone_instructions: >-
  Be concise and actionable. Avoid subjective rewrites, repeating CI results,
  and suggesting changes outside the PR scope.

reviews:
  profile: chill
  high_level_summary: false
  poem: false
  request_changes_workflow: false
  collapse_walkthrough: true
  enable_prompt_for_ai_agents: false
  assess_linked_issues: true

  path_filters:
    - "!public/**"
    - "!resources/**"

  path_instructions:
    - path: "content/docs/**/*.md"
      instructions: |
        Check that the change targets the intended KEDA documentation version and
        does not accidentally alter historical-version behavior. Validate Hugo
        front matter, shortcodes, anchors, internal links, API names, and examples.
        Prefer concrete correctness findings over subjective prose rewrites.

